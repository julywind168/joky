name: Formatting

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rustfmt:
    name: rustfmt check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      - name: Check formatting
        run: cargo fmt --all --check
