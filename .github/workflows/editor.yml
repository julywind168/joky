name: VS Code extension

on:
  push:
    branches: [main]
    paths: ['editors/vscode/**', 'src/core/parser/lexer*', 'examples/**', 'src/stdlib/**', '.github/workflows/editor.yml']
  pull_request:
    paths: ['editors/vscode/**', 'src/core/parser/lexer*', 'examples/**', 'src/stdlib/**', '.github/workflows/editor.yml']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run package
      - name: Checksum VSIX
        run: sha256sum joky-*.vsix > joky-vscode-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: joky-vscode
          path: |
            editors/vscode/joky-*.vsix
            editors/vscode/joky-vscode-SHA256SUMS
          if-no-files-found: error

  attach-to-release:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: joky-vscode
          path: extension
      - name: Attach extension to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" extension/*.vsix extension/joky-vscode-SHA256SUMS
