name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux coverage is currently non-blocking (see continue-on-error below).
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Install sqlite dev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Build release runtime archive for AOT tests
        run: cargo build --locked --release --manifest-path crates/joky-runtime/Cargo.toml
      - name: Run library and integration tests
        run: cargo test --locked --tests -- --test-threads=1
