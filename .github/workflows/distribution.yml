name: Build distributions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Build host distribution
        run: ./scripts/package.sh
      - name: Verify native conversion and shutdown regressions
        shell: bash
        run: |
          cargo test --locked --release --lib float_math_and_checked_conversions_match_backends
          cargo test --locked --release --test cli float_math_fixture_runs_in_aot_and_reports_static_errors
          cargo test --locked --release --lib string_queries_matches_models_in_independent_aot_objects
          cargo test --locked --release --lib signal_pipe_reader_outlives_close_and_callback_unregistration
          for attempt in {1..20}; do
            echo "Shutdown/reactor repetition $attempt/20"
            cargo test --locked --release --lib shared_reactor_
            cargo test --locked --release --test cli shutdown_signal_subscription_is_explicit_repeatable_and_scoped
          done
      - name: Verify relocated toolchain
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/joky-relocated"
          cd target/dist
          shasum -a 256 -c *.sha256
          tar -xzf joky-*.tar.gz -C "$RUNNER_TEMP/joky-relocated"
          bundle=$(find "$RUNNER_TEMP/joky-relocated" -mindepth 1 -maxdepth 1 -type d)
          "$bundle/bin/joky" --version --verbose | tee "$RUNNER_TEMP/joky-version.txt"
          grep -Fx "commit: $GITHUB_SHA" "$RUNNER_TEMP/joky-version.txt"
          grep -Fx 'source-state: clean' "$RUNNER_TEMP/joky-version.txt"
          grep -Fx 'profile: release' "$RUNNER_TEMP/joky-version.txt"
          grep -Fx "target: $(cat "$bundle/TARGET")" "$RUNNER_TEMP/joky-version.txt"
          cd "$RUNNER_TEMP"
          "$bundle/bin/joky" run "$bundle/share/doc/joky/examples/hello.jk" > hello.out
          test "$(cat hello.out)" = 'Hello, world!'
          "$bundle/bin/joky" run --interpreter "$bundle/share/doc/joky/examples/hello.jk" > hello.out
          test "$(cat hello.out)" = 'Hello, world!'
          "$bundle/bin/joky" build "$bundle/share/doc/joky/examples/hello.jk" -o hello
          test "$(./hello)" = 'Hello, world!'
      - uses: actions/upload-artifact@v4
        with:
          name: joky-${{ matrix.os }}
          path: target/dist/joky-*
          if-no-files-found: error
