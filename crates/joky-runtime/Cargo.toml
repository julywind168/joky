[package]
name = "joky-runtime"
version = "0.1.0"
edition = "2021"
description = "Standalone Joky runtime library for AOT programs"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib"]
doctest = false

[features]
test-support = []

[dependencies]
joky-runtime-abi = { path = "../joky-runtime-abi" }
joky-runtime-core = { path = "../joky-runtime-core" }
crossbeam-deque = "0.8"
getrandom = "0.4.3"
libloading = "0.9"
mio = { version = "1.0", features = ["net", "os-poll"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2.2"
webpki-roots = "1"
x509-parser = { version = "0.18.1", default-features = false }
sha2 = "0.11.0"
unicode-segmentation = "1.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
