[package]
name = "joky"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "A programming language"
license = "MIT"

[lib]
# AOT links the compiler-independent archive from `crates/joky-runtime`.
# Keep the compiler crate as an rlib so it cannot accidentally become the
# runtime archive again.
crate-type = ["rlib"]

[features]
runtime-test-support = ["joky-runtime/test-support"]

[dependencies]
joky-runtime = { path = "crates/joky-runtime" }
joky-runtime-abi = { path = "crates/joky-runtime-abi" }
joky-runtime-core = { path = "crates/joky-runtime-core" }
ariadne = "0.6.0"
cranelift-codegen = "0.135.2"
cranelift-frontend = "0.135.2"
cranelift-jit = "0.135.2"
cranelift-object = "0.135.2"
cranelift-module = "0.135.2"
cranelift-native = "0.135.2"
petgraph = "0.8"
crossbeam-deque = "0.8"
unicode-segmentation = "1.13"
mio = { version = "1.0", features = ["net", "os-poll"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
hex = "0.4"
gimli = { version = "0.34", default-features = false, features = ["write", "std"] }
object = { version = "0.39", default-features = false, features = ["write", "read", "std"] }
# bincode 2+ dropped the serde API this crate relies on for module caches
# and ABI payloads; porting to Encode/Decode derives is a separate change.
bincode = "1.3.3"
libloading = "0.9"

[dev-dependencies]
gimli = { version = "0.34", default-features = false, features = ["read"] }
criterion = "0.8"
insta = "1.48"
joky-runtime = { path = "crates/joky-runtime", features = ["test-support"] }

[[bench]]
name = "compiler_pipeline"
harness = false

# AOT build records hash the compiler and runtime archives, including a second
# runtime hash after linking. Keep SHA-256 fast in dev/test builds without
# optimizing the compiler itself or disabling its debug checks.
[profile.dev.package.sha2]
opt-level = 3

# Every JIT run, including full cache hits, lowers MIR through Cranelift, and
# every AOT build emits objects and DWARF. Unoptimized register allocation
# dominated CLI test time, so optimize the code generator stack as well; the
# compiler and runtime crates stay unoptimized with their debug checks.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.cranelift-module]
opt-level = 3
[profile.dev.package.cranelift-jit]
opt-level = 3
[profile.dev.package.cranelift-object]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.object]
opt-level = 3
[profile.dev.package.gimli]
opt-level = 3
