[package]
name = "joky"
version = "0.1.0"
edition = "2021"
description = "The Joky programming language: compiler, runtime, and standard library"

[workspace]
members = ["tools/image-derive", "tools/stdlib-bootstrap"]
default-members = ["."]
resolver = "2"

[workspace.dependencies]
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1.0.9"
getrandom = "0.4.3"
sha2 = "0.11.1"
hmac = "0.13.0"
argon2 = { version = "0.6.0", default-features = false, features = ["password-hash", "zeroize"] }
zeroize = { version = "1.8", features = ["alloc"] }
# Keep native code generation and unwinding, without compiler timing instrumentation.
cranelift-codegen  = { version = "0.137.1", default-features = false, features = ["std", "host-arch", "unwind"] }
cranelift-frontend = "0.137.1"
cranelift-module   = "0.137.1"
cranelift-jit      = "0.137.1"
cranelift-native   = "0.137.1"
cranelift-object   = "0.137.1"
ariadne = { version = "0.6.0", features = ["auto-color"] }
mio = { version = "1.2.4", features = ["os-poll", "net"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "std", "serde"] }
libc = "0.2"
signal-hook = "0.4.6"
joky-image-derive = { path = "tools/image-derive" }

[dependencies]
sqlx.workspace = true
tokio.workspace = true
futures-util.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
getrandom.workspace = true
sha2.workspace = true
hmac.workspace = true
argon2.workspace = true
zeroize.workspace = true
cranelift-codegen.workspace = true
cranelift-frontend.workspace = true
cranelift-module.workspace = true
cranelift-jit.workspace = true
cranelift-native.workspace = true
cranelift-object.workspace = true
ariadne.workspace = true
mio.workspace = true
toml.workspace = true
joky-image-derive.workspace = true

[build-dependencies]
joky-stdlib-bootstrap = { path = "tools/stdlib-bootstrap" }

[[bin]]
name = "joky"
path = "src/main.rs"

[lib]
crate-type = ["rlib", "staticlib"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true
signal-hook.workspace = true

[dev-dependencies]
serde_json = "1"
libloading = "0.8"

[[bench]]
name = "while"
harness = false

[[bench]]
name = "map"
harness = false

# Tests repeatedly compile Joky programs. Optimize stable dependencies without
# increasing the cost of recompiling Joky during ordinary Debug builds.
[profile.dev.package."*"]
opt-level = 2

# Keep compiler-heavy tests fast while retaining development safety checks.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# VM error handling relies on catching runtime panics.
panic = "unwind"
