[package]
name = "joky-vm-interop"
version = "0.1.0"
edition = "2021"
description = "Joky VM interoperability prototype"

[dependencies]
cranelift-codegen  = { version = "*", features = ["unwind"] }
cranelift-frontend = "*"
cranelift-module   = "*"
cranelift-jit      = "*"
cranelift-native   = "*"
cranelift-object   = "*"

[[bin]]
name = "joky-vm-interop"
path = "src/main.rs"

[lib]
crate-type = ["rlib", "staticlib"]

[dev-dependencies]
libloading = "0.8"
