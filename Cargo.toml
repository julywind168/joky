[package]
name = "joky"
version = "0.1.0"
edition = "2021"
description = "The Joky programming language: compiler, runtime, and standard library"

[dependencies]
# Keep native code generation and unwinding, without compiler timing instrumentation.
cranelift-codegen  = { version = "0.136", default-features = false, features = ["std", "host-arch", "unwind"] }
cranelift-frontend = "0.136"
cranelift-module   = "0.136"
cranelift-jit      = "0.136"
cranelift-native   = "0.136"
cranelift-object   = "0.136"
ariadne = { version = "0.6.0", features = ["auto-color"] }
mio = { version = "1.2.4", features = ["os-poll", "net"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "std", "serde"] }

[[bin]]
name = "joky"
path = "src/main.rs"

[lib]
crate-type = ["rlib", "staticlib"]

[dev-dependencies]
libloading = "0.8"

[[bench]]
name = "while"
harness = false

[[bench]]
name = "map"
harness = false

# Tests repeatedly compile Joky programs. Optimize stable dependencies without
# increasing the cost of recompiling Joky during ordinary Debug builds.
[profile.dev.package."*"]
opt-level = 2

# Keep compiler-heavy tests fast while retaining development safety checks.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# VM error handling relies on catching runtime panics.
panic = "unwind"
