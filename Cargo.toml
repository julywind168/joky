[package]
name = "joky"
version = "0.1.0"
edition = "2021"
description = "The Joky programming language: compiler, runtime, and standard library"

[dependencies]
cranelift-codegen  = { version = "0.136", features = ["unwind"] }
cranelift-frontend = "0.136"
cranelift-module   = "0.136"
cranelift-jit      = "0.136"
cranelift-native   = "0.136"
cranelift-object   = "0.136"

[[bin]]
name = "joky"
path = "src/main.rs"

[lib]
crate-type = ["rlib", "staticlib"]

[dev-dependencies]
libloading = "0.8"
