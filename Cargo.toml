[package]
name = "joky"
version = "0.1.0"
edition = "2021"
description = "The Joky programming language: compiler, runtime, and standard library"

[dependencies]
# Keep native code generation and unwinding, without compiler timing instrumentation.
cranelift-codegen  = { version = "0.136", default-features = false, features = ["std", "host-arch", "unwind"] }
cranelift-frontend = "0.136"
cranelift-module   = "0.136"
cranelift-jit      = "0.136"
cranelift-native   = "0.136"
cranelift-object   = "0.136"
ariadne = { version = "0.6.0", features = ["auto-color"] }

[[bin]]
name = "joky"
path = "src/main.rs"

[lib]
crate-type = ["rlib", "staticlib"]

[dev-dependencies]
libloading = "0.8"

[[bench]]
name = "while"
harness = false

[[bench]]
name = "map"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# VM error handling relies on catching runtime panics.
panic = "unwind"
